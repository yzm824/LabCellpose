<!--QC_HOST_SCRIPT-->
<script>(()=>{
const frame=document.getElementById('codex-visualization');let appearance={reduceTransparency:false};
window.labNativeMagnify=(factor,x,y)=>{const r=frame.getBoundingClientRect();if(Number.isFinite(factor)&&Number.isFinite(x)&&Number.isFinite(y)&&x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)frame.contentWindow.postMessage({type:'viewer-native-gesture',factor,x:x-r.left,y:y-r.top},'*');};
window.labSetAppearance=value=>{appearance={reduceTransparency:!!value.reduceTransparency};document.documentElement.dataset.reduceTransparency=String(appearance.reduceTransparency);frame.contentWindow.postMessage({type:'viewer-appearance',...appearance},'*');};
addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.type==='viewer-height')window.labSetAppearance(appearance);});
frame.srcdoc=frame.dataset.srcdoc;frame.removeAttribute('data-srcdoc');
})()</script>
